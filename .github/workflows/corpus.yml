name: corpus

# Pinned corpus regression: lints public MIT or Apache-2.0 projects at fixed commits and compares
# the finding count per rule and the skip count per reason with tests/corpus/pins.json. Runs
# weekly, when the pins or the script change, on demand, and from release.yml before the release
# job. Never on ordinary pull requests.

on:
  schedule:
    # Tuesdays 05:41 UTC
    - cron: '41 5 * * 2'
  push:
    branches: [main]
    paths:
      - 'tests/corpus/**'
      - 'scripts/corpus-regression.js'
      - '.github/workflows/corpus.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run corpus
