name: mutation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'stryker.config.json'
      - 'vitest.mutation.config.ts'
      - 'scripts/mutation-check.mjs'
      - 'CONTRIBUTING.md'
      - '.github/workflows/mutation.yml'
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  # One Stryker run per folder, in parallel; `check` merges the reports.
  stryker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: rules-syntax
            mutate: 'src/rules/**/*.ts,!src/rules/realtime-table-published.ts,!src/rules/rls-readable.ts,!src/rules/table-granted.ts'
          - shard: rules-schema
            mutate: 'src/rules/realtime-table-published.ts,src/rules/rls-readable.ts,src/rules/table-granted.ts'
          - shard: supabase
            mutate: 'src/supabase/**/*.ts'
          - shard: roles-schema
            mutate: 'src/roles/**/*.ts,src/schema/**/*.ts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mutation -- --mutate "$MUTATE"
        env:
          MUTATE: ${{ matrix.mutate }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: mutation-report-${{ matrix.shard }}
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 14

  check:
    needs: stryker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-report-*
          path: reports/shards
      - run: >-
          node scripts/mutation-check.mjs
          reports/shards/mutation-report-rules-syntax/mutation.json
          reports/shards/mutation-report-rules-schema/mutation.json
          reports/shards/mutation-report-supabase/mutation.json
          reports/shards/mutation-report-roles-schema/mutation.json
